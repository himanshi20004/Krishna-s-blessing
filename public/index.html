<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shri Krishna's Guidance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f0f4f8;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: #2e3a59;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .krishna {
      background: #e6f7f7;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .user {
      background: #fff7e6;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
      white-space: pre-wrap;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background: #2e3a59;
      color: white;
      border-radius: 25px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #3e4a70;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      input[type="text"] {
        font-size: 15px;
      }

      button {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <h1>🕉️ Speak with Shri Krishna 🕉️</h1>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="question" placeholder="Speak your heart, dear one..." />
    <button onclick="askKrishna()">Ask</button>
  </div>

  <script>
    async function askKrishna() {
      const input = document.getElementById("question");
      const question = input.value.trim();
      if (!question) return;

      const chat = document.getElementById("chat");

      const userMsg = document.createElement("div");
      userMsg.className = "user";
      userMsg.textContent = question;
      chat.appendChild(userMsg);

      input.value = "";
      input.focus();

      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await res.json();

        if (data.error) {
          alert("Error: " + data.error);
          return;
        }

        const krishnaMsg = document.createElement("div");
        krishnaMsg.className = "krishna";
        krishnaMsg.textContent = data.answer;
        chat.appendChild(krishnaMsg);

        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        console.error(err);
        alert("Something went wrong. Please try again.");
      }
    }

    document.getElementById("question").addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        askKrishna();
      }
    });
  </script>
</body>
</html>
